<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Didos AI - Partner</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
        #chat-box { display: flex; flex-direction: column; gap: 15px; height: 400px; overflow-y: auto; background: #1e1e1e; padding: 15px; border-radius: 15px; border: 1px solid #333; }
        .didos-msg { align-self: flex-start; background: #2a2a2a; padding: 10px; border-radius: 15px 15px 15px 2px; max-width: 80%; border-left: 4px solid #3b82f6; }
        .user-msg { align-self: flex-end; background: #3b82f6; padding: 10px; border-radius: 15px 15px 2px 15px; max-width: 80%; }
        .label { font-size: 0.7rem; opacity: 0.6; margin-bottom: 5px; display: block; font-weight: bold; }
        .input-group { display: flex; gap: 8px; margin-top: 15px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #2a2a2a; color: white; outline: none; }
        button { padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-kirim { background: #3b82f6; color: white; }
        .btn-reset { background: #ff4444; color: white; width: 100%; margin-top: 10px; }
        /* Tambahan style untuk loading agar lebih jelas */
        .loading { font-style: italic; opacity: 0.8; }
    </style>
</head>
<body>
    <h3>Didos AI ⚡</h3>
    <div id="chat-box"></div>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Ketik di sini...">
        <button class="btn-kirim" onclick="kirimPesan()">Kirim</button>
    </div>
    <button class="btn-reset" onclick="resetMemori()">Reset Memori</button>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('userInput');

        // Tambahkan support enter untuk mengirim pesan agar lebih cepat digunakan
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') kirimPesan();
        });

        window.onload = () => {
            const nama = localStorage.getItem('namaUser');
            if (nama) {
                tambahPesan("Didos AI", `Halo! ${nama}, akhirnya aku bangun. Ada yang mau ditanya?`);
            } else {
                tambahPesan("Didos AI", "Halo! Aku Didos. Partner cerdasmu. Nama kamu siapa?");
            }
        };

        async function kirimPesan() {
            const pesan = input.value.trim();
            if (!pesan) return;
            tambahPesan("Kamu", pesan);
            input.value = '';

            const namaTerdaftar = localStorage.getItem('namaUser');
            if (!namaTerdaftar) {
                localStorage.setItem('namaUser', pesan);
                setTimeout(() => { 
                    tambahPesan("Didos AI", `Oke ${pesan}, namamu sudah kusimpan! Tanya apa saja.`); 
                }, 800);
            } else {
                // Simpan elemen loading untuk mudah dihapus nanti
                const loadingMsg = tambahPesan("Didos AI", "<span class='loading'>Didos lagi mikir...</span>");
                try {
                    // Tambahkan timeout agar tidak tunggu terlalu lama jika server lambat
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000); // Timeout 10 detik

                    const resp = await fetch(`https://ai.lugu.vip/api/chat?text=${encodeURIComponent(pesan)}`, {
                        signal: controller.signal,
                        method: 'GET', // Pastikan method sesuai
                        headers: { 'Content-Type': 'application/json' }
                    });
                    clearTimeout(timeoutId);

                    if (!resp.ok) throw new Error(`Gagal mengambil data (Kode: ${resp.status})`);
                    const data = await resp.json();

                    // Hapus pesan loading
                    loadingMsg.remove();
                    // Tampilkan jawaban AI yang akurat
                    tambahPesan("Didos AI", data.response || "Maaf, aku tidak mengerti maksudmu.");

                } catch (e) {
                    // Hapus pesan loading jika ada error
                    if (loadingMsg) loadingMsg.remove();
                    // Berikan pesan error yang jelas agar pengguna tahu masalahnya
                    let errorMsg = "Maaf, ada masalah saat menghubungi AI. Coba lagi nanti ya!";
                    if (e.name === 'AbortError') errorMsg = "Waktu tunggu terlalu lama. Coba lagi atau periksa koneksi internetmu!";
                    tambahPesan("Didos AI", errorMsg);
                }
            }
        }

        function tambahPesan(pengirim, teks) {
            const isDidos = pengirim === "Didos AI";
            const className = isDidos ? "didos-msg" : "user-msg";
            // Buat elemen baru agar bisa dihapus dengan mudah nanti
            const msgDiv = document.createElement('div');
            msgDiv.className = className;
            msgDiv.innerHTML = `<span class="label">${pengirim}</span><div>${teks}</div>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv; // Kembalikan elemen untuk keperluan hapus
        }

        function resetMemori() {
            if (confirm("Hapus ingatan Didos?")) {
                localStorage.removeItem('namaUser');
                location.reload();
            }
        }
    </script>
</body>
</html>
